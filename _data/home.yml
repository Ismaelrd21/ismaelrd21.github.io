      title: "Investigación en telemetría y control predictivo"
      text: "Análisis y extracción de telemetría en simulaciones de conducción Assetto Corsa para desarrollo de modelos predictivos y comprensión dinámica de comportamiento vehicular en tiempo real."

    - period: "2022 - 2026"
      title: "Ingeniería en Automatización y Robótica"
      text: "Desarrollo de proyectos en PLC Siemens, TIA Portal, RobotStudio, Node-RED, visión computacional, robótica industrial y automatización de procesos inteligentes."

