      title: "Centro de Transformación Energética (CTE) - Ayudante de investigación"
      text: "Investigación aplicada en automatización, sistemas eléctricos inteligentes y simulación en tiempo real. Desarrollo de estudios sobre protocolo IEC 61850 utilizando OPAL-RT, Linux y plataformas Jetson para integración y comunicación industrial."

